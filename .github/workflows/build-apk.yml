name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - develop
      - hardening/**
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - both
          - release
      create_release:
        description: 'Publish a GitHub Release (requires release signing secrets)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies and build web assets
        run: |
          npm install --include=dev --no-audit --prefer-offline
          npm run build
          test -s dist/index.html

      - name: Sync Capacitor Android project
        run: |
          test -f capacitor.config.json
          test -f android/gradlew
          npx cap sync android
          chmod +x android/gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android
          cache-read-only: false

      - name: Configure release signing
        id: signing
        if: startsWith(github.ref, 'refs/tags/v') || inputs.build_type == 'both' || inputs.build_type == 'release' || inputs.create_release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release builds require RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD secrets. No fallback signing key is generated."
            exit 1
          fi
          KEYSTORE_PATH="$GITHUB_WORKSPACE/android/app/release.keystore"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build Android APKs
        working-directory: android
        env:
          BUILD_CHOICE: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || (inputs.create_release && 'release' || inputs.build_type || 'debug') }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ "$BUILD_CHOICE" = "debug" ] || [ "$BUILD_CHOICE" = "both" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          fi
          if [ "$BUILD_CHOICE" = "release" ] || [ "$BUILD_CHOICE" = "both" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
              --stacktrace --no-daemon
          fi

      - name: Collect APK artifacts
        run: |
          set -euo pipefail
          mkdir -p output-apks
          find android/app/build/outputs/apk -type f -name '*.apk' -print -exec cp {} output-apks/ \;
          test -n "$(find output-apks -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh output-apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Smart-OSM-APK-${{ github.sha }}
          path: output-apks/*.apk
          retention-days: 30
          if-no-files-found: error

  publish-release:
    name: Publish signed APK release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: Smart-OSM-APK-${{ github.sha }}
          path: output-apks

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: output-apks/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('release-{0}', github.sha) }}
          name: Smart OSM Next - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.sha) }}
          draft: false
          prerelease: false
          body: |
            Smart OSM Next Android APK build.

            - Commit: ${{ github.sha }}
            - Ref: ${{ github.ref_name }}
            - Built from the repository workflow.
