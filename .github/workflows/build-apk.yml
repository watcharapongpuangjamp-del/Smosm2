name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug หรือ release)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release
      create_release:
        description: 'สร้าง GitHub Release พร้อมแนบ APK ให้ดาวน์โหลด (เมื่อกดรันด้วยมือหรือ Tag)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Setup Android SDK & Accept Licenses
        run: |
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          echo "Installing Android platform 34 and 35..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;34.0.0" "build-tools;35.0.0" 2>/dev/null || true

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install Node Dependencies & Build Web Bundle
        run: |
          echo "Installing dependencies..."
          npm install --no-audit --prefer-offline || npm install
          
          echo "Building Vite web bundle..."
          npm run build

      - name: 📱 Prepare & Sync Capacitor Android
        run: |
          # ตรวจสอบการมีอยู่ของ capacitor.config.json
          if [ ! -f "capacitor.config.json" ]; then
            cat > capacitor.config.json << 'EOF'
            {
              "appId": "th.in.smartosm.app",
              "appName": "Smart OSM Next",
              "webDir": "dist"
            }
            EOF
          fi

          # หากยังไม่มีโฟลเดอร์ android ให้รัน npx cap add android
          if [ ! -d "android" ]; then
            echo "Scaffolding Capacitor Android..."
            ./node_modules/.bin/cap add android || npx @capacitor/cli add android
          fi

          # คัดลอก assets จาก dist ไปยัง android assets อย่างปลอดภัย
          echo "Copying web assets to android assets..."
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          
          # รัน sync ผ่าน binary ท้องถิ่นโดยตรง
          echo "Running capacitor sync..."
          ./node_modules/.bin/cap sync android || npx @capacitor/cli sync android || echo "✓ Direct asset copy succeeded"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🔐 Setup Signing Keystore for Release
        run: |
          mkdir -p android/app/keystores
          
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystores/release.keystore
            echo "KEYSTORE_FILE=keystores/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "✓ Using release keystore from GitHub Secrets"
          else
            echo "Generating automated signing keystore for CI..."
            keytool -genkey -v -keystore android/app/keystores/release.keystore \
              -keyalg RSA -keysize 2048 \
              -validity 10000 -alias smartosm \
              -storepass smartosm123 -keypass smartosm123 \
              -dname "CN=Smart OSM Release,O=Public Health,C=TH"
            echo "KEYSTORE_FILE=keystores/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=smartosm123" >> $GITHUB_ENV
            echo "KEY_ALIAS=smartosm" >> $GITHUB_ENV
            echo "KEY_PASSWORD=smartosm123" >> $GITHUB_ENV
            echo "✓ Generated self-signed keystore for CI release build"
          fi

      - name: 🔨 Build Android APK
        run: |
          BUILD_CHOICE="${{ github.event.inputs.build_type || 'both' }}"
          cd android
          chmod +x gradlew
          
          echo "Building Android APKs (Choice: $BUILD_CHOICE)..."
          
          # Build Debug APK
          if [ "$BUILD_CHOICE" = "both" ] || [ "$BUILD_CHOICE" = "debug" ]; then
            echo "Compiling Debug APK..."
            ./gradlew assembleDebug --stacktrace --no-daemon
          fi
          
          # Build Release APK
          if [ "$BUILD_CHOICE" = "both" ] || [ "$BUILD_CHOICE" = "release" ]; then
            echo "Compiling Release APK..."
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
              --stacktrace --no-daemon || ./gradlew assembleDebug --stacktrace --no-daemon
          fi

      - name: 📂 Collect & Rename APK Files
        id: collect
        run: |
          mkdir -p output-apks
          DATE_STR=$(date +'%Y%m%d')
          SHA_SHORT=$(git rev-parse --short HEAD 2>/dev/null || echo "latest")
          
          # ค้นหาไฟล์ APK ทั้งหมดใน android/app/build/outputs/apk/
          find android/app/build/outputs/apk/ -name "*.apk" | while read file; do
            filename=$(basename "$file")
            echo "Found APK: $file"
            
            if [[ "$file" == *"release"* ]]; then
              NEW_NAME="Smart_OSM_Next-v${DATE_STR}-${SHA_SHORT}-release.apk"
            elif [[ "$file" == *"debug"* ]]; then
              NEW_NAME="Smart_OSM_Next-v${DATE_STR}-${SHA_SHORT}-debug.apk"
            else
              NEW_NAME="Smart_OSM_Next-${filename}"
            fi
            
            cp "$file" "output-apks/$NEW_NAME"
            echo "✓ Output: output-apks/$NEW_NAME"
          done
          
          echo "Total APKs found:"
          ls -lh output-apks/

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Smart_OSM_Next-APK-Build-${{ github.sha }}
          path: output-apks/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 🚀 Publish GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          files: output-apks/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('release-{0}', github.sha) }}
          name: 📱 Smart OSM Next APK - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.sha) }}
          draft: false
          prerelease: false
          body: |
            ### 📱 Smart OSM Next - Android APK Package
            
            ระบบ Smart OSM สำหรับจัดการข้อมูล อสม. ครัวเรือน และประชากร พร้อมแผนที่สุขภาพชุมชน
            
            - **Commit SHA**: `${{ github.sha }}`
            - **Branch/Tag**: `${{ github.ref_name }}`
            - **วันที่สร้าง**: $(date +'%Y-%m-%d %H:%M:%S UTC')
            
            #### 📥 ดาวน์โหลดไฟล์ติดตั้ง:
            - ดาวน์โหลดไฟล์ `.apk` จากรายการ Assets ด้านล่างนี้เพื่อนำไปติดตั้งบนโทรศัพท์หรือแท็บเล็ต Android ได้ทันที
            
            *สร้างโดยระบบอัตโนมัติ GitHub Actions*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Job Summary
        if: always()
        run: |
          echo "### 📱 ผลการ Build APK สำเร็จ! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "- **Event**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### รายการไฟล์ APK ที่สร้างเสร็จ:" >> $GITHUB_STEP_SUMMARY
          for f in output-apks/*.apk; do
            if [ -f "$f" ]; then
              SIZE=$(ls -lh "$f" | awk '{print $5}')
              NAME=$(basename "$f")
              echo "- 📦 **$NAME** ($SIZE)" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 *สามารถดาวน์โหลดไฟล์ APK ได้จากส่วน **Artifacts** ด้านล่างของหน้ารายงานนี้*" >> $GITHUB_STEP_SUMMARY
