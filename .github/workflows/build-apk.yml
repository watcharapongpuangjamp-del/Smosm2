name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - develop
      - fixv1
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
      - fixv1
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug หรือ release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - both
          - debug
          - release
      create_release:
        description: 'สร้าง GitHub Release พร้อมแนบ APK ให้ดาวน์โหลด (เมื่อกดรันด้วยมือหรือ Tag)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 📦 Setup Android SDK & Accept Licenses
        run: |
          echo "Accepting Android SDK licenses..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          echo "Installing Android platform and build tools..."
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install Node Dependencies & Build Web Bundle
        run: |
          echo "Installing dependencies..."
          npm install --include=dev --no-audit --prefer-offline
          
          echo "Building Vite web bundle..."
          npm run build
          
          echo "Verifying web bundle in dist/..."
          ls -la dist/

      - name: 📱 Prepare & Sync Capacitor Android
        run: |
          # 1. ตรวจสอบการมีอยู่ของ capacitor.config.json
          if [ ! -f "capacitor.config.json" ]; then
            echo "Generating capacitor.config.json..."
            echo '{"appId": "th.in.smartosm.app", "appName": "Smart OSM Next", "webDir": "dist"}' > capacitor.config.json
          fi

          # 2. ถ้ามีโฟลเดอร์ android อยู่แล้ว (จากการ commit หรือ checkout) ให้ใช้ cap sync ทันที
          if [ -d "android" ] && [ -f "android/build.gradle" ]; then
            echo "Android platform already exists in repository. Skipping cap add."
          else
            echo "Scaffolding Capacitor Android platform..."
            npx cap add android --no-interactive
          fi

          # 3. กำหนดสิทธิ์ permission โฟลเดอร์ android อย่างสมบูรณ์
          echo "Setting full permissions on android directory..."
          chmod -R u+rwX,go+rX android

          # 4. ทำการ sync assets และ plugins เข้าสู่ android ผ่าน Capacitor CLI
          echo "Syncing web assets to Capacitor Android..."
          npx cap sync android

          # 5. กำหนดสิทธิ์ execute ให้กับ Gradle wrapper ทันที
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
            echo "✓ android/gradlew marked executable"
          fi

          # 6. ตรวจสอบความสมบูรณ์ของ web assets ใน android
          mkdir -p android/app/src/main/assets/public
          if [ -z "$(ls -A android/app/src/main/assets/public 2>/dev/null)" ]; then
            echo "Fallback: copy dist assets to android/app/src/main/assets/public..."
            cp -r dist/* android/app/src/main/assets/public/
          fi

          echo "✓ Android platform prepared successfully:"
          ls -la android/

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android
          cache-read-only: false

      - name: 🔐 Setup Signing Keystore for Release
        run: |
          mkdir -p android/app/keystores
          KEYSTORE_PATH="$GITHUB_WORKSPACE/android/app/keystores/release.keystore"
          
          BUILD_CHOICE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_CHOICE" = "both" ] || [ "$BUILD_CHOICE" = "release" ]; then
            if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] || \
               [ -z "${{ secrets.STORE_PASSWORD }}" ] || \
               [ -z "${{ secrets.KEY_ALIAS }}" ] || \
               [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
              echo "Release builds require RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD secrets." >&2
              exit 1
            fi
            printf '%s' "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
            echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: 🔨 Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          BUILD_CHOICE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "Building Android APKs (Choice: $BUILD_CHOICE)..."
          
          # 1. Build Debug APK (ติดตั้งได้ทันที)
          if [ "$BUILD_CHOICE" = "both" ] || [ "$BUILD_CHOICE" = "debug" ]; then
            echo "Compiling Debug APK with Gradle..."
            ./gradlew assembleDebug --stacktrace --no-daemon
          fi
          
          # 2. Build Release APK (ลงนามด้วย Keystore)
          if [ "$BUILD_CHOICE" = "both" ] || [ "$BUILD_CHOICE" = "release" ]; then
            echo "Compiling Release APK with Gradle..."
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
              --stacktrace --no-daemon
          fi

      - name: 📂 Collect & Rename APK Files
        id: collect
        run: |
          mkdir -p output-apks
          DATE_STR=$(date +'%Y%m%d')
          SHA_SHORT=$(git rev-parse --short HEAD 2>/dev/null || echo "latest")
          
          # ค้นหาไฟล์ APK ทั้งหมดใน android/
          find android/ -name "*.apk" 2>/dev/null | sort -u | while read -r file; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Found APK: $file"
              
              if [[ "$file" == *"release"* ]]; then
                NEW_NAME="Smart_OSM_Next-v${DATE_STR}-${SHA_SHORT}-release.apk"
              elif [[ "$file" == *"debug"* ]]; then
                NEW_NAME="Smart_OSM_Next-v${DATE_STR}-${SHA_SHORT}-debug.apk"
              else
                NEW_NAME="Smart_OSM_Next-${filename}"
              fi
              
              cp "$file" "output-apks/$NEW_NAME"
              echo "✓ Copied to: output-apks/$NEW_NAME"
            fi
          done
          
          echo "=== Summary of output APKs ==="
          ls -lh output-apks/

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Smart_OSM_Next-APK-Build-${{ github.sha }}
          path: output-apks/*.apk
          retention-days: 30
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Smart_OSM_Next-APK-Build-${{ github.sha }}
          path: output-apks

      - name: 🚀 Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: output-apks/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('release-{0}', github.sha) }}
          name: 📱 Smart OSM Next APK - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.sha) }}
          draft: false
          prerelease: false
          body: |
            ### 📱 Smart OSM Next - Android APK Package
            
            ระบบ Smart OSM สำหรับจัดการข้อมูล อสม. ครัวเรือน และประชากร พร้อมแผนที่สุขภาพชุมชน
            
            - **Commit SHA**: `${{ github.sha }}`
            - **Branch/Tag**: `${{ github.ref_name }}`
            - **วันที่สร้าง**: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            
            #### 📥 ดาวน์โหลดไฟล์ติดตั้ง:
            - ดาวน์โหลดไฟล์ `.apk` จากรายการ Assets ด้านล่างนี้เพื่อนำไปติดตั้งบนโทรศัพท์หรือแท็บเล็ต Android ได้ทันที
            
            *สร้างโดยระบบอัตโนมัติ GitHub Actions*

      - name: 📊 Job Summary
        if: always()
        run: |
          echo "### 📱 ผลการ Build APK" >> $GITHUB_STEP_SUMMARY
          echo "- **Event**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### รายการไฟล์ APK ที่สร้างเสร็จ:" >> $GITHUB_STEP_SUMMARY
          echo "Build job result: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 *ดาวน์โหลด APK จากส่วน Artifacts ของ run นี้เมื่อ job สำเร็จ*" >> $GITHUB_STEP_SUMMARY
